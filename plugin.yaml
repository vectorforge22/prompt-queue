name: prompt-queue
version: 1.3.0
description: "Kanban-style prompt queue for the Hermes desktop app: Play drains cards one at a time into a per-card target MODE — new session, existing session, project (create-new supported), or a profile's canonical Bot Chat (bot mode) — gated on the global model slot and background-review completion. Queue/Done/Skipped/Failed tabs, resizable composer, per-card target picker, default-mode gear, and a trust-aware ::enqueue directive (ask-first by default)."
author: "@vectorforge22"
requires_hermes: ">=0.21.5"
